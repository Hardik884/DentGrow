<svg width="128" height="100" viewBox="0 0 128 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!--
    DentGrow favicon — the `simple` reading of the mark (see
    components/shared/DentGrowLogo and lib/brand/mark.ts): the tooth silhouette
    filled, without the growth bars or the arrow.

    A browser tab renders a favicon at 16px, where three overlapping shapes
    collapse into a smudge — the same reason the component drops to this form
    below 32px. Same silhouette, same gradient, so it still reads as the mark.
  -->
  <defs>
    <linearGradient id="dg-favicon" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#0A5347"/>
      <stop offset="45%" stop-color="#0D6B5E"/>
      <stop offset="100%" stop-color="#35A18F"/>
    </linearGradient>
  </defs>

  <!-- TOOTH_PATH -->
  <path
    d="M18 42C18 22 27 10 38 10C47 10 53 15 58 19C63 15 70 10 79 10C90 10 98 22 98 42C98 56 94 70 89 81C86 87 83 90 80 90C77 90 75 83 73 71C70 55 66 43 58 43C50 43 46 55 43 71C41 83 39 90 36 90C33 90 30 87 27 81C22 70 18 56 18 42Z"
    fill="url(#dg-favicon)"/>
</svg>
